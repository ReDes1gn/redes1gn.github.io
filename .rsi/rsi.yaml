schema: hydra-rsi/1
# Committed bytes of the static site files a visitor downloads (HTML, fonts, images, text, xml).
# Smaller means a faster first load for the marketing site.
metrics:
  - id: site.shipped_bytes
    kind: size
    better: lower
    unit: bytes
    measure: "python scripts/rsi/shipped_bytes.py"
    pick: 'shipped_bytes=(\d+)'
    gate: exact
    light: true
